[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-redactor"
version = "0.1.0"
description = "Redact PII from CSV files. All processing is local — no data leaves your machine."
requires-python = ">=3.10"
dependencies = [
    "presidio-analyzer>=2.2,<3",
    "presidio-anonymizer>=2.2,<3",
    "spacy>=3.7,<4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ticket-redactor = "ticket_redactor.redactor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
